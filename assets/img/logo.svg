<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" role="img" aria-labelledby="title desc">
<title id="title">FindPro — Trouvez le bon professionnel</title>
<desc id="desc">Logo FindPro avec un curseur pixelisé rouge-orange.</desc>

<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E11D2E"/>
    <stop offset="100%" stop-color="#F97316"/>
  </linearGradient>
</defs>
<!-- Pixel sparks -->
<g fill="url(#brand)">
  <rect x="8" y="4" width="9" height="9"/>
  <rect x="20" y="12" width="8" height="8"/>
  <rect x="3" y="22" width="8" height="8"/>
  <rect x="15" y="26" width="7" height="7"/>
  <!-- Geometric cursor -->
  <path d="M20 20 L20 65 L30 55 L37 73 L46 69 L38 51 L53 51 Z"/>
  <rect x="47" y="60" width="8" height="8"/>
  <rect x="39" y="69" width="8" height="8"/>
</g>

<g font-family="Oxanium, Inter, Arial, sans-serif" font-weight="800" font-size="67" letter-spacing="-2">
  <text x="78" y="82" fill="#111827">Find</text>
  <text x="222" y="82" fill="url(#brand)">Pro</text>
</g>
<text x="80" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748B" letter-spacing=".2">Trouvez le bon professionnel</text>
</svg>