<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MCD Merise — FindPro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      background-color: #0f172a;

      justify-content: center;
      align-items: center;

      overflow: hidden;
      width: 2700px;
      height: 1950px;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

</head>
<body>

        <text x="1585" y="1650" font-size="12" font-weight="700" fill="#1e40af">RG02 :</text>

        <text x="1585" y="1675" font-size="12" font-weight="700" fill="#1e40af">RG03 :</text>

        <text x="1585" y="1700" font-size="12" font-weight="700" fill="#1e40af">RG04 :</text>

        <text x="1585" y="1725" font-size="12" font-weight="700" fill="#1e40af">RG05 :</text>
        <text x="1635" y="1725" font-size="12" fill="#334155">Seuls les profils approuvés sont visibles dans la recherche publique.</text>

        <text x="1585" y="1750" font-size="12" font-weight="700" fill="#1e40af">RG06 :</text>
        <text x="1635" y="1750" font-size="12" fill="#334155">Modification de profil par le pro avec re-vérification possible par l'administration.</text>

        <text x="1585" y="1775" font-size="12" font-weight="700" fill="#1e40af">RG07 :</text>
        <text x="1635" y="1775" font-size="12" fill="#334155">Avis possible UNIQUEMENT après demande terminée et confirmée par le client.</text>

        <!-- Colonne 2 -->
        <text x="2115" y="1625" font-size="12" font-weight="700" fill="#b91c1c">RG08 :</text>
        <text x="2165" y="1625" font-size="12" fill="#334155">Mots de passe sécurisés par hachage fort (BCRYPT / ARGON2).</text>

        <text x="2115" y="1650" font-size="12" font-weight="700" fill="#b91c1c">RG09 :</text>
        <text x="2165" y="1650" font-size="12" fill="#334155">Contrôles d'accès et droits vérifiés côté serveur selon le rôle.</text>

        <text x="2115" y="1675" font-size="12" font-weight="700" fill="#b91c1c">RG10 :</text>
        <text x="2165" y="1675" font-size="12" fill="#334155">Aucun paiement intégré dans le MVP ; aucun flux financier simulé.</text>

        <text x="2115" y="1700" font-size="12" font-weight="700" fill="#b91c1c">RG11 :</text>
        <text x="2165" y="1700" font-size="12" fill="#334155">Services de cybersécurité : autorisation expresse du propriétaire requise.</text>

        <text x="2115" y="1725" font-size="12" font-weight="700" fill="#b91c1c">RG12 :</text>
        <text x="2165" y="1725" font-size="12" fill="#334155">Traçabilité complète des modérations : qui, quand, quoi, pourquoi.</text>

        <text x="2115" y="1750" font-size="12" font-weight="700" fill="#b91c1c">RG13 :</text>
        <text x="2165" y="1750" font-size="12" fill="#334155">Limite stricte de 3 messages client avant acceptation de la demande.</text>

        <text x="2115" y="1775" font-size="12" font-weight="700" fill="#b91c1c">RG14 :</text>
        <text x="2165" y="1775" font-size="12" fill="#334155">Demande terminée après marquage a_confirmer pro puis validation client.</text>
